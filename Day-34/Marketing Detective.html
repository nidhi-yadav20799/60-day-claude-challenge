<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Marketing Detective — Case Files</title>
<style>
  :root{
    --bg-void:#14100d;
    --cork:#3c2a1e;
    --cork-dark:#2a1c13;
    --cork-line:rgba(0,0,0,0.35);
    --panel:#221810;
    --panel-light:#2c2018;
    --paper:#ece2d0;
    --paper-dark:#d9c9a8;
    --ink:#2a2016;
    --ink-soft:#4a3c2c;
    --accent:#d97757;
    --accent-bright:#ff9a6b;
    --accent-dim:#8a4a34;
    --amber:#e8a33d;
    --sticky-yellow:#f2d675;
    --sticky-orange:#f0a868;
    --sticky-rose:#e08a7d;
    --text-light:#f3e9dc;
    --text-muted:#a99884;
    --danger:#c1443d;
    --success:#7cb56f;
    --shadow-deep: 0 18px 40px rgba(0,0,0,0.55);
    --font-display: 'Courier New', Courier, monospace;
    --font-body: Georgia, 'Times New Roman', serif;
  }

  *{ box-sizing:border-box; }
  html,body{ height:100%; }
  body{
    margin:0;
    background:
      radial-gradient(ellipse at 20% -10%, rgba(217,119,87,0.10), transparent 45%),
      radial-gradient(ellipse at 100% 110%, rgba(232,163,61,0.08), transparent 50%),
      var(--bg-void);
    color:var(--text-light);
    font-family:var(--font-body);
    overflow-x:hidden;
    -webkit-font-smoothing:antialiased;
  }
  #root{ min-height:100vh; }

  ::selection{ background:var(--accent); color:#1a1108; }

  button{ font-family:var(--font-display); cursor:pointer; }
  button:focus-visible, a:focus-visible, [tabindex]:focus-visible{
    outline:2px solid var(--accent-bright);
    outline-offset:3px;
    border-radius:4px;
  }

  h1,h2,h3,h4{ font-family:var(--font-display); margin:0; letter-spacing:0.04em; }

  /* ---------- layout shell ---------- */
  .app-shell{
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:stretch;
  }
  .stage-wrap{
    flex:1;
    width:100%;
    max-width:1180px;
    margin:0 auto;
    padding:24px 20px 60px;
    display:flex;
    flex-direction:column;
    gap:20px;
  }

  /* ---------- top bar / progress steps ---------- */
  .topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:16px;
    padding:14px 22px;
    background:linear-gradient(180deg, var(--panel-light), var(--panel));
    border-bottom:1px solid rgba(217,119,87,0.25);
    box-shadow:0 6px 18px rgba(0,0,0,0.4);
    position:sticky;
    top:0;
    z-index:50;
  }
  .brand{
    display:flex;
    align-items:center;
    gap:10px;
    font-family:var(--font-display);
    letter-spacing:0.08em;
    color:var(--accent-bright);
    font-size:15px;
    white-space:nowrap;
  }
  .brand .badge{
    width:28px;height:28px;border-radius:50%;
    background:radial-gradient(circle at 35% 30%, var(--accent-bright), var(--accent) 60%, var(--accent-dim) 100%);
    display:flex;align-items:center;justify-content:center;
    font-size:14px; box-shadow:0 0 14px rgba(217,119,87,0.55), inset 0 2px 3px rgba(255,255,255,0.35);
    color:#1a1108;
    font-weight:bold;
  }
  .steps{
    display:flex;
    gap:6px;
    overflow-x:auto;
    scrollbar-width:none;
  }
  .steps::-webkit-scrollbar{ display:none; }
  .step-tab{
    font-size:10px;
    letter-spacing:0.06em;
    padding:6px 10px;
    border-radius:3px 3px 0 0;
    background:var(--cork-dark);
    color:var(--text-muted);
    border:1px solid rgba(0,0,0,0.4);
    border-bottom:none;
    white-space:nowrap;
    transition:color .3s ease, background .3s ease, transform .3s ease;
  }
  .step-tab.active{
    background:var(--accent);
    color:#1c1108;
    transform:translateY(-2px);
    box-shadow:0 -4px 10px rgba(217,119,87,0.4);
  }
  .step-tab.done{ color:var(--amber); }
  .rank-pill{
    font-size:11px;
    letter-spacing:0.05em;
    color:var(--text-muted);
    white-space:nowrap;
    border:1px solid rgba(232,163,61,0.35);
    padding:5px 10px;
    border-radius:20px;
    background:rgba(232,163,61,0.06);
  }
  .rank-pill b{ color:var(--amber); }

  /* ---------- generic buttons ---------- */
  .btn{
    appearance:none;
    border:none;
    padding:13px 26px;
    border-radius:4px;
    font-size:13px;
    letter-spacing:0.09em;
    text-transform:uppercase;
    font-weight:bold;
    background:linear-gradient(180deg, var(--accent-bright), var(--accent));
    color:#1c1108;
    box-shadow:0 8px 20px rgba(217,119,87,0.35), inset 0 1px 0 rgba(255,255,255,0.4);
    transition:transform .18s ease, box-shadow .18s ease, filter .18s ease;
  }
  .btn:hover{ transform:translateY(-2px); box-shadow:0 12px 26px rgba(217,119,87,0.5); filter:brightness(1.05); }
  .btn:active{ transform:translateY(0); }
  .btn:disabled{ opacity:0.35; cursor:not-allowed; transform:none; box-shadow:none; }
  .btn.ghost{
    background:transparent;
    color:var(--text-muted);
    border:1px solid rgba(169,152,132,0.4);
    box-shadow:none;
  }
  .btn.ghost:hover{ color:var(--text-light); border-color:var(--accent); transform:translateY(-2px); }
  .btn.danger-outline{
    background:transparent;
    color:var(--danger);
    border:1px solid rgba(193,68,61,0.5);
    box-shadow:none;
  }

  /* ---------- corkboard ---------- */
  .corkboard{
    position:relative;
    border-radius:10px;
    background:
      repeating-radial-gradient(circle at 12% 18%, rgba(0,0,0,0.16) 0 1.5px, transparent 2px 40px),
      repeating-radial-gradient(circle at 70% 60%, rgba(0,0,0,0.14) 0 1.5px, transparent 2px 34px),
      linear-gradient(135deg, var(--cork), var(--cork-dark));
    border:10px solid var(--panel);
    box-shadow:var(--shadow-deep), inset 0 0 60px rgba(0,0,0,0.5);
    padding:26px;
  }

  .pin{
    position:absolute;
    width:14px;height:14px;
    border-radius:50%;
    background:radial-gradient(circle at 32% 28%, #fff 0%, var(--danger) 42%, #7a2620 100%);
    box-shadow:0 3px 6px rgba(0,0,0,0.6), inset 0 1px 1px rgba(255,255,255,0.5);
    z-index:5;
  }
  .pin.amber{ background:radial-gradient(circle at 32% 28%, #fff 0%, var(--amber) 42%, #8a5c14 100%); }

  /* ---------- title screen ---------- */
  .title-screen{
    min-height:calc(100vh - 60px);
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    position:relative;
    padding:40px 20px;
  }
  .title-screen::before{
    content:"";
    position:absolute; inset:0;
    background:
      repeating-radial-gradient(circle at 15% 20%, rgba(217,119,87,0.05) 0 2px, transparent 3px 60px),
      repeating-radial-gradient(circle at 80% 75%, rgba(232,163,61,0.05) 0 2px, transparent 3px 70px);
    pointer-events:none;
  }
  .title-inner{ position:relative; max-width:640px; }
  .title-eyebrow{
    font-size:12px;
    letter-spacing:0.35em;
    color:var(--amber);
    margin-bottom:18px;
    text-transform:uppercase;
  }
  .title-badge{
    width:96px;height:96px;
    margin:0 auto 26px;
    border-radius:50%;
    background:radial-gradient(circle at 35% 30%, var(--accent-bright), var(--accent) 55%, var(--accent-dim) 100%);
    display:flex; align-items:center; justify-content:center;
    font-size:44px;
    box-shadow:0 0 0 6px rgba(217,119,87,0.12), 0 0 40px rgba(217,119,87,0.5), inset 0 3px 6px rgba(255,255,255,0.35);
    animation: badge-pulse 3.4s ease-in-out infinite;
  }
  @keyframes badge-pulse{
    0%,100%{ box-shadow:0 0 0 6px rgba(217,119,87,0.12), 0 0 40px rgba(217,119,87,0.5), inset 0 3px 6px rgba(255,255,255,0.35); }
    50%{ box-shadow:0 0 0 10px rgba(217,119,87,0.18), 0 0 60px rgba(217,119,87,0.7), inset 0 3px 6px rgba(255,255,255,0.35); }
  }
  .title-screen h1{
    font-size:clamp(30px,5vw,50px);
    color:var(--text-light);
    text-shadow:0 2px 0 rgba(0,0,0,0.5), 0 0 30px rgba(217,119,87,0.25);
    margin-bottom:14px;
  }
  .title-screen p.lede{
    font-family:var(--font-body);
    font-size:17px;
    color:var(--text-muted);
    line-height:1.6;
    margin-bottom:32px;
  }
  .stat-row{
    display:flex; gap:14px; justify-content:center; margin-bottom:34px; flex-wrap:wrap;
  }
  .stat-chip{
    font-size:11px; letter-spacing:0.05em; color:var(--text-muted);
    border:1px dashed rgba(169,152,132,0.35); padding:8px 14px; border-radius:20px;
  }
  .stat-chip b{ color:var(--amber); font-family:var(--font-display); }

  /* ---------- folder (case assignment) ---------- */
  .folder-scene{
    display:flex; align-items:center; justify-content:center;
    min-height:calc(100vh - 130px);
    padding:20px;
  }
  .folder{
    width:100%; max-width:620px;
    position:relative;
    animation: folder-drop .6s cubic-bezier(.2,.9,.3,1.15);
  }
  @keyframes folder-drop{
    0%{ opacity:0; transform:translateY(-40px) rotate(-4deg) scale(0.96); }
    100%{ opacity:1; transform:translateY(0) rotate(0deg) scale(1); }
  }
  .folder-tab{
    width:180px; height:26px;
    background:var(--paper-dark);
    border-radius:6px 12px 0 0;
    margin-left:24px;
    box-shadow:0 -2px 6px rgba(0,0,0,0.2) inset;
  }
  .folder-body{
    background:
      repeating-linear-gradient(0deg, rgba(0,0,0,0.02) 0 2px, transparent 2px 4px),
      linear-gradient(160deg, var(--paper), var(--paper-dark));
    border-radius:4px 10px 10px 10px;
    padding:34px 30px 30px;
    box-shadow:var(--shadow-deep);
    position:relative;
    color:var(--ink);
  }
  .confidential-stamp{
    position:absolute;
    top:22px; right:26px;
    border:3px solid var(--danger);
    color:var(--danger);
    font-family:var(--font-display);
    font-weight:bold;
    font-size:13px;
    letter-spacing:0.12em;
    padding:5px 10px;
    transform:rotate(9deg);
    opacity:0.85;
    border-radius:4px;
  }
  .folder-body h2{
    font-size:24px;
    color:var(--ink);
    margin-bottom:2px;
  }
  .folder-body .industry{
    font-family:var(--font-display);
    font-size:12px;
    letter-spacing:0.08em;
    color:var(--accent-dim);
    text-transform:uppercase;
    margin-bottom:20px;
  }
  .brief-row{ margin-bottom:16px; }
  .brief-row .label{
    font-family:var(--font-display);
    font-size:10px;
    letter-spacing:0.1em;
    text-transform:uppercase;
    color:var(--ink-soft);
    margin-bottom:4px;
  }
  .brief-row .value{ font-size:15px; line-height:1.55; }
  .folder-actions{ margin-top:26px; display:flex; justify-content:flex-end; }

  /* ---------- board screen (case files) ---------- */
  .section-heading{
    display:flex; align-items:baseline; justify-content:space-between; flex-wrap:wrap; gap:10px;
    margin-bottom:4px;
  }
  .section-heading h2{ font-size:19px; color:var(--text-light); }
  .section-heading .sub{ font-size:12px; color:var(--text-muted); letter-spacing:0.04em; font-family:var(--font-display); }

  .progress-track{
    height:6px; border-radius:6px; background:rgba(255,255,255,0.06);
    overflow:hidden; margin-bottom:6px;
  }
  .progress-fill{
    height:100%; background:linear-gradient(90deg, var(--accent-dim), var(--accent-bright));
    border-radius:6px; transition:width .5s ease;
    box-shadow:0 0 12px rgba(217,119,87,0.6);
  }

  .file-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(220px,1fr));
    gap:22px;
    position:relative;
    padding:18px 6px 8px;
  }
  .string-svg{ position:absolute; inset:0; width:100%; height:100%; pointer-events:none; overflow:visible; }
  .string-svg line{ stroke:var(--accent); stroke-width:1.6; opacity:0.45; stroke-dasharray:3 4; }

  .case-hub{
    grid-column:1 / -1;
    display:flex; align-items:center; justify-content:center;
    margin:-6px 0 4px;
  }
  .case-hub-tag{
    background:var(--panel-light);
    border:1px solid rgba(232,163,61,0.4);
    color:var(--amber);
    font-family:var(--font-display);
    font-size:12px; letter-spacing:0.1em;
    padding:9px 18px;
    border-radius:20px;
    box-shadow:0 0 16px rgba(232,163,61,0.15);
  }

  .file-folder{
    position:relative;
    background:linear-gradient(160deg, var(--paper), var(--paper-dark));
    color:var(--ink);
    border-radius:6px;
    padding:20px 18px 18px;
    min-height:150px;
    box-shadow:0 10px 22px rgba(0,0,0,0.4);
    cursor:pointer;
    transition:transform .25s ease, box-shadow .25s ease;
    border-top:22px solid var(--paper-dark);
  }
  .file-folder:hover{ transform:translateY(-6px) rotate(-0.5deg); box-shadow:0 16px 30px rgba(0,0,0,0.5), 0 0 22px rgba(217,119,87,0.25); }
  .file-folder .ficon{ font-size:26px; margin-bottom:10px; display:block; }
  .file-folder h3{ font-size:15px; color:var(--ink); margin-bottom:6px; }
  .file-folder p{ font-size:12.5px; color:var(--ink-soft); line-height:1.5; margin:0; }
  .file-folder .opened-badge{
    position:absolute; top:-14px; right:12px;
    background:var(--success); color:#123010;
    font-size:10px; letter-spacing:0.06em; padding:4px 8px; border-radius:10px;
    font-family:var(--font-display); box-shadow:0 4px 10px rgba(0,0,0,0.3);
  }

  .board-footer{
    display:flex; justify-content:center; margin-top:10px;
  }

  /* ---------- modal ---------- */
  .modal-overlay{
    position:fixed; inset:0; background:rgba(8,6,4,0.72);
    display:flex; align-items:center; justify-content:center;
    z-index:200; padding:20px;
    animation:fade-in .25s ease;
    backdrop-filter:blur(2px);
  }
  @keyframes fade-in{ from{opacity:0;} to{opacity:1;} }
  .modal-paper{
    max-width:620px; width:100%; max-height:84vh; overflow-y:auto;
    background:linear-gradient(160deg, var(--paper), var(--paper-dark));
    color:var(--ink); border-radius:6px; padding:30px 28px 26px;
    box-shadow:0 30px 70px rgba(0,0,0,0.65);
    position:relative;
    animation: paper-in .35s cubic-bezier(.2,.9,.3,1.2);
  }
  @keyframes paper-in{ from{opacity:0; transform:translateY(20px) scale(0.96);} to{opacity:1; transform:translateY(0) scale(1);} }
  .modal-close{
    position:absolute; top:14px; right:16px;
    background:none; border:none; font-size:20px; color:var(--ink-soft);
    width:30px; height:30px; border-radius:50%;
  }
  .modal-close:hover{ background:rgba(0,0,0,0.08); color:var(--ink); }
  .modal-paper h3{ color:var(--ink); font-size:19px; margin-bottom:16px; padding-right:24px; }

  .stat-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:12px; margin-bottom:6px; }
  .stat-card{
    background:rgba(0,0,0,0.05);
    border:1px solid rgba(74,60,44,0.25);
    border-radius:6px; padding:12px 14px;
    animation: stat-in .5s ease both;
  }
  .stat-card .k{ font-family:var(--font-display); font-size:10px; letter-spacing:0.08em; text-transform:uppercase; color:var(--accent-dim); margin-bottom:4px; }
  .stat-card .v{ font-size:17px; font-weight:bold; color:var(--ink); }
  @keyframes stat-in{ from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:translateY(0);} }

  .quote-list{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:12px; }
  .quote-list li{
    background:rgba(0,0,0,0.04);
    border-left:3px solid var(--accent);
    padding:10px 14px;
    font-style:italic;
    font-size:14px;
    line-height:1.5;
    border-radius:2px 6px 6px 2px;
  }

  .social-row{
    display:flex; justify-content:space-between; align-items:center; gap:10px;
    padding:10px 4px; border-bottom:1px dashed rgba(74,60,44,0.25);
    font-size:13.5px;
  }
  .social-row:last-child{ border-bottom:none; }
  .social-row .platform{ font-family:var(--font-display); font-weight:bold; }
  .social-row .note{ color:var(--ink-soft); font-size:12.5px; text-align:right; max-width:55%; }

  .budget-chart{ display:flex; flex-direction:column; gap:10px; }
  .budget-row{ display:flex; align-items:center; gap:10px; }
  .budget-label{ width:150px; font-size:12.5px; flex-shrink:0; }
  .budget-track{ flex:1; height:14px; background:rgba(0,0,0,0.08); border-radius:8px; overflow:hidden; }
  .budget-fill{
    height:100%; width:0%; border-radius:8px;
    background:linear-gradient(90deg, var(--accent-dim), var(--accent));
    transition:width 1s cubic-bezier(.2,.8,.2,1);
  }
  .budget-fill.grown{ }
  .budget-pct{ width:40px; text-align:right; font-family:var(--font-display); font-size:12px; flex-shrink:0; }
  .channel-chips{ display:flex; flex-wrap:wrap; gap:8px; margin-top:14px; }
  .channel-chip{
    font-size:11.5px; padding:5px 10px; border-radius:14px;
    background:rgba(217,119,87,0.12); border:1px solid rgba(217,119,87,0.35); color:var(--accent-dim);
    font-family:var(--font-display);
  }

  /* ---------- investigate screen ---------- */
  .investigate-board{
    position:relative;
    height:min(560px, 78vh);
    touch-action:none;
  }
  .target-dock{
    position:absolute; left:50%; top:46%; transform:translate(-50%,-50%);
    width:132px; height:132px;
    border-radius:50%;
    border:2px dashed rgba(232,163,61,0.55);
    display:flex; align-items:center; justify-content:center;
    flex-direction:column;
    text-align:center;
    color:var(--amber);
    font-family:var(--font-display);
    font-size:11px; letter-spacing:0.05em;
    background:radial-gradient(circle, rgba(232,163,61,0.08), transparent 70%);
    animation: dock-breathe 2.6s ease-in-out infinite;
    z-index:2;
    padding:10px;
  }
  @keyframes dock-breathe{
    0%,100%{ box-shadow:0 0 0 0 rgba(232,163,61,0.0); }
    50%{ box-shadow:0 0 26px 6px rgba(232,163,61,0.18); }
  }
  .target-dock .dock-icon{ font-size:24px; margin-bottom:6px; }
  .target-dock.complete{ border-color:var(--success); color:var(--success); border-style:solid; }

  .clue-card{
    position:absolute;
    width:190px;
    background:linear-gradient(160deg, var(--sticky-yellow), var(--sticky-orange));
    color:#3a2a10;
    padding:16px 14px 14px;
    border-radius:3px;
    box-shadow:0 10px 20px rgba(0,0,0,0.45);
    font-size:13px;
    line-height:1.45;
    user-select:none;
    touch-action:none;
    z-index:8;
  }
  .clue-card.dragging{ z-index:40; box-shadow:0 22px 40px rgba(0,0,0,0.6); cursor:grabbing; }
  .clue-card:not(.connected){ cursor:grab; }
  .clue-card .clue-pin{
    position:absolute; top:-10px; left:50%; transform:translateX(-50%);
    font-size:16px; filter:drop-shadow(0 3px 3px rgba(0,0,0,0.5));
  }
  .clue-card.connected{
    z-index:6;
    box-shadow:0 6px 16px rgba(0,0,0,0.4), 0 0 18px rgba(124,181,111,0.35);
  }
  .connected-stamp{
    position:absolute; bottom:-9px; right:-6px;
    background:var(--success); color:#12300f;
    font-family:var(--font-display); font-size:9px; letter-spacing:0.06em;
    padding:3px 7px; border-radius:10px; box-shadow:0 4px 8px rgba(0,0,0,0.4);
    transform:rotate(-6deg);
  }

  .investigate-footer{
    display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap;
    margin-top:6px;
  }
  .clue-progress{ font-size:12.5px; color:var(--text-muted); font-family:var(--font-display); letter-spacing:0.04em; }
  .clue-progress b{ color:var(--amber); }

  /* ---------- solve screen ---------- */
  .solve-intro{ text-align:center; max-width:640px; margin:0 auto 6px; }
  .solve-intro h2{ font-size:22px; margin-bottom:10px; color:var(--text-light); }
  .solve-intro p{ color:var(--text-muted); font-size:14.5px; line-height:1.6; }

  .options-grid{
    display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); gap:20px;
    margin-top:10px;
  }
  .option-note{
    position:relative;
    background:linear-gradient(160deg, var(--paper), var(--paper-dark));
    color:var(--ink);
    padding:20px 18px;
    border-radius:3px;
    box-shadow:0 10px 20px rgba(0,0,0,0.4);
    font-size:14px; line-height:1.55;
    cursor:pointer;
    border:3px solid transparent;

  /* ---------- case closed ---------- */
  .closed-scene{

  .stamp.correct{ color:var(--success); }
  .stamp.wrong{ color:var(--danger); }
  .closed-sub{ color:var(--text-muted); font-size:15px; max-width:520px; line-height:1.6; }

  .report-header{
    background:linear-gradient(160deg, var(--paper), var(--paper-dark));

    border-radius:8px;

  .clue-recap li{

  }

    display:flex; align-items:center; justify-content:center;
    font-family:var(--font-display); font-weight:bold;
    animation: pop-in .4s ease both;
  }
  @keyframes pop-in{ from{ transform:scale(0); } to{ transform:scale(1); } }

  .improve-list li{

    flex-shrink:0; width:22px; height:22px; border-radius:5px;
    background:rgba(217,119,87,0.15); border:1px solid rgba(217,119,87,0.4);
    color:var(--accent-bright); font-size:11px; font-family:var(--font-display);
    display:flex; align-items:center; justify-content:center;
  }

  .report-grid{ display:grid; grid-template-columns:1.1fr 1fr; gap:20px; }
  .report-footer{ display:flex; justify-content:center; gap:14px; margin-top:6px; flex-wrap:wrap; }

  footer.credits{
    text-align:center; padding:26px 20px 40px; color:var(--text-muted); font-size:11px; letter-spacing:0.05em;
  }

  /* ---------- responsive ---------- */
  @media (max-width: 760px){
    .report-grid{ grid-template-columns:1fr; }

  }

  @media (prefers-reduced-motion: reduce){
    *{ animation-duration:0.01ms !important; animation-iteration-count:1 !important; transition-duration:0.01ms !important; }
  }
</style>

/* =========================================================================
   HELPERS
   ========================================================================= */
function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}

function rankInfo(solved){
  if(solved >= 10) return { title:"Master Marketing Detective", icon:"🕵️‍♂️" };
  if(solved >= 6) return { title:"Senior Detective", icon:"🔍" };
  if(solved >= 3) return { title:"Detective", icon:"🧭" };
  if(solved >= 1) return { title:"Junior Detective", icon:"📎" };
  return { title:"Rookie Investigator", icon:"🎓" };
}

const STAGES = [
  { key:"title", label:"Start" },
  { key:"assign", label:"I · Case File" },
  { key:"board", label:"II · Case Board" },
  { key:"investigate", label:"III · Investigation" },
  { key:"solve", label:"IV · Accusation" },
  { key:"closed", label:"V · Verdict" },
  { key:"report", label:"VI · Report" },
];

/* =========================================================================
   SMALL REUSABLE COMPONENTS
   ========================================================================= */
function TopBar({ stage, solved, attempted }){
  const idx = STAGES.findIndex(s => s.key === stage);
  const info = rankInfo(solved);
  return (
    <div className="topbar">
      <div className="brand"><span className="badge">MD</span> Marketing Detective Agency</div>
      <div className="steps">
        {STAGES.slice(1).map((s, i) => (
          <div key={s.key} className={"step-tab" + (s.key===stage ? " active" : "") + (i+1 < idx ? " done" : "")}>{s.label}</div>
        ))}
      </div>
      <div className="rank-pill">{info.icon} <b>{info.title}</b> · {solved}/{attempted} solved</div>
    </div>
  );
}

function Modal({ title, icon, onClose, children }){
  useEffect(() => {
    function onKey(e){ if(e.key === "Escape") onClose(); }
    window.addEventListener("keydown", onKey);
    return () => window.removeEventListener("keydown", onKey);
  }, [onClose]);
  return (
    <div className="modal-overlay" onClick={onClose}>
      <div className="modal-paper" onClick={e => e.stopPropagation()} role="dialog" aria-modal="true" aria-label={title}>
        <button className="modal-close" onClick={onClose} aria-label="Close">✕</button>
        <h3>{icon} {title}</h3>
        {children}
      </div>
    </div>
  );
}

function BudgetChart({ allocation }){
  const [grown, setGrown] = useState(false);
  useEffect(() => {
    const t = setTimeout(() => setGrown(true), 80);
    return () => clearTimeout(t);
  }, []);
  return (
    <div className="budget-chart">
      {allocation.map((row, i) => (
        <div className="budget-row" key={row.channel}>
          <div className="budget-label">{row.channel}</div>
          <div className="budget-track">
            <div className={"budget-fill" + (grown ? " grown" : "")} style={{ width: grown ? row.pct + "%" : "0%", transitionDelay: (i*0.08) + "s" }}></div>
          </div>
          <div className="budget-pct">{row.pct}%</div>
        </div>
      ))}
    </div>
  );
}

/* =========================================================================
   STAGE 0 — TITLE
   ========================================================================= */
function TitleScreen({ onStart, solved, attempted }){
  return (
    <div className="title-screen">
      <div className="title-inner">
        <div className="title-eyebrow">Case files are open</div>
        <div className="title-badge">🕵️</div>
        <h1>Marketing Detective</h1>
        <p className="lede">
          A campaign has gone wrong somewhere. The reach was there. The budget was spent.
          But the results don't add up — and it's your job to find out why. Pull the
          case file, walk the board, follow the clues, and name the mistake before you
          close the case.
        </p>
        <div className="stat-row">
          <div className="stat-chip">Cases in the archive · <b>{CASES.length}</b></div>
          <div className="stat-chip">Cases you've solved · <b>{solved}</b></div>
          <div className="stat-chip">Cases attempted · <b>{attempted}</b></div>
        </div>
        <button className="btn" onClick={onStart}>Open a New Case File</button>
      </div>
    </div>
  );
}

/* =========================================================================
   STAGE 1 — ASSIGNMENT
   ========================================================================= */
function AssignmentScreen({ caseData, onContinue }){
  return (
    <div className="folder-scene">
      <div className="folder">
        <div className="folder-tab"></div>
        <div className="folder-body">
          <div className="confidential-stamp">Case #{String(caseData.id).padStart(3,"0")}</div>
          <h2>{caseData.company}</h2>
          <div className="industry">{caseData.industry}</div>

          <div className="brief-row">
            <div className="label">Campaign Objective</div>
            <div className="value">{caseData.objective}</div>
          </div>
          <div className="brief-row">
            <div className="label">Target Audience</div>
            <div className="value">{caseData.audience}</div>
          </div>
          <div className="brief-row">
            <div className="label">Your Assignment</div>
            <div className="value">Something in this campaign underperformed badly. Review the evidence, connect the clues, and identify the single primary marketing mistake behind it.</div>
          </div>

          <div className="folder-actions">
            <button className="btn" onClick={onContinue}>Open the Case Board →</button>
          </div>
        </div>
      </div>
    </div>
  );
}

/* =========================================================================
   STAGE 2 — CASE BOARD (evidence folders)
   ========================================================================= */
const FILES = [
  { key:"metrics", icon:"📊", title:"Campaign Metrics", desc:"Reach, CTR, engagement, conversions, and sales figures." },
  { key:"comments", icon:"💬", title:"Customer Comments", desc:"Direct quotes pulled from reviews and social replies." },
  { key:"social", icon:"📱", title:"Social Performance", desc:"Platform-by-platform stats and sentiment notes." },
  { key:"budget", icon:"💰", title:"Channels & Budget", desc:"Where the money went, and how it was split." },
];

function FileContent({ fileKey, caseData }){
  if(fileKey === "metrics"){
    const m = caseData.metrics;
    const entries = [
      ["Reach", m.reach], ["CTR", m.ctr], ["Engagement", m.engagement],
      ["Conversions", m.conversions], ["Sales", m.sales],
    ];
    return (
      <div className="stat-grid">
        {entries.map(([k,v], i) => (
          <div className="stat-card" key={k} style={{ animationDelay: (i*0.06)+"s" }}>
            <div className="k">{k}</div>
            <div className="v">{v}</div>
          </div>
        ))}
      </div>
    );
  }
  if(fileKey === "comments"){
    return (
      <ul className="quote-list">
        {caseData.comments.map((c,i) => <li key={i}>"{c}"</li>)}
      </ul>
    );
  }
  if(fileKey === "social"){
    return (
      <div>
        {caseData.social.map((s,i) => (
          <div className="social-row" key={i}>
            <div className="platform">{s.platform}</div>
            <div>{s.stat}</div>
            <div className="note">{s.note}</div>
          </div>
        ))}
      </div>
    );
  }
  if(fileKey === "budget"){
    return (
      <div>
        <div style={{marginBottom:"14px", fontSize:"13px", color:"var(--ink-soft)"}}>Total budget: <b style={{color:"var(--ink)"}}>{caseData.budget.total}</b></div>
        <BudgetChart allocation={caseData.budget.allocation} />
        <div className="channel-chips">
          {caseData.channels.map(c => <span className="channel-chip" key={c}>{c}</span>)}
        </div>
      </div>
    );
  }
  return null;
}

function BoardScreen({ caseData, opened, onOpen, onContinue }){
  const [activeFile, setActiveFile] = useState(null);
  const openedCount = Object.values(opened).filter(Boolean).length;
  const allOpened = openedCount === FILES.length;

  function openFile(key){
    setActiveFile(key);
    onOpen(key);
  }

  return (
    <React.Fragment>
      <div className="section-heading">
        <h2>The Case Board</h2>
        <div className="sub">Review every file before you can walk the evidence wall</div>
      </div>
      <div className="progress-track"><div className="progress-fill" style={{ width: (openedCount/FILES.length*100)+"%" }}></div></div>

      <div className="corkboard">
        <div className="file-grid">
          <div className="case-hub"><div className="case-hub-tag">📌 Case #{String(caseData.id).padStart(3,"0")} — {caseData.company}</div></div>
          {FILES.map(f => (
            <div className="file-folder" key={f.key} onClick={() => openFile(f.key)} role="button" tabIndex="0"
                 onKeyDown={(e) => { if(e.key==="Enter") openFile(f.key); }}>
              {opened[f.key] && <div className="opened-badge">Reviewed</div>}
              <span className="ficon">{f.icon}</span>
              <h3>{f.title}</h3>
              <p>{f.desc}</p>
            </div>
          ))}
        </div>
      </div>

      <div className="board-footer">
        <button className="btn" disabled={!allOpened} onClick={onContinue}>
          {allOpened ? "Proceed to the Evidence Wall →" : `Review All Files (${openedCount}/${FILES.length})`}
        </button>
      </div>

      {activeFile && (
        <Modal title={FILES.find(f=>f.key===activeFile).title} icon={FILES.find(f=>f.key===activeFile).icon} onClose={() => setActiveFile(null)}>
          <FileContent fileKey={activeFile} caseData={caseData} />
        </Modal>
      )}
    </React.Fragment>
  );
}

/* =========================================================================
   STAGE 3 — INTERACTIVE INVESTIGATION (draggable clues)
   ========================================================================= */
const HOME_POS = [
  { left:"14%", top:"14%", rot:-7 },
  { left:"72%", top:"18%", rot:6 },
  { left:"38%", top:"74%", rot:-3 },
];
const DOCK_POS = [
  { left:"38%", top:"36%", rot:-5 },
  { left:"62%", top:"36%", rot:4 },
  { left:"50%", top:"58%", rot:1 },
];

function useDrag(onRelease){
  const elRef = useRef(null);
  const dragInfo = useRef({ dragging:false, startX:0, startY:0 });
  const [transform, setTransform] = useState({ x:0, y:0 });
  const [dragging, setDragging] = useState(false);

  const onPointerDown = useCallback((e) => {
    e.preventDefault();
    try{ e.currentTarget.setPointerCapture(e.pointerId); }catch(err){}
    dragInfo.current = { dragging:true, startX:e.clientX, startY:e.clientY };
    setDragging(true);
  }, []);

  const onPointerMove = useCallback((e) => {
    if(!dragInfo.current.dragging) return;
    const dx = e.clientX - dragInfo.current.startX;
    const dy = e.clientY - dragInfo.current.startY;
    setTransform({ x:dx, y:dy });
  }, []);

  const onPointerUp = useCallback((e) => {
    if(!dragInfo.current.dragging) return;
    dragInfo.current.dragging = false;
    setDragging(false);
    onRelease(elRef, () => setTransform({ x:0, y:0 }));
  }, [onRelease]);

  return { elRef, transform, dragging, bind: { onPointerDown, onPointerMove, onPointerUp } };
}

function ClueCard({ index, text, connected, onCheck, isTop }){
  const handleRelease = useCallback((ref, reset) => {
    const ok = onCheck(index, ref);
    if(!ok) reset();
  }, [index, onCheck]);
  const { elRef, transform, dragging, bind } = useDrag(handleRelease);

  const home = HOME_POS[index];
  const dock = DOCK_POS[index];

  const style = connected
    ? { left:dock.left, top:dock.top, transform:`translate(-50%,-50%) rotate(${dock.rot}deg)`, transition:"left .55s cubic-bezier(.2,.8,.2,1), top .55s cubic-bezier(.2,.8,.2,1), transform .55s ease" }
    : { left:home.left, top:home.top, transform:`translate(-50%,-50%) translate(${transform.x}px, ${transform.y}px) rotate(${home.rot}deg)`, transition:dragging ? "none" : "transform .4s cubic-bezier(.34,1.56,.64,1)" };

  return (
    <div
      ref={elRef}
      className={"clue-card" + (dragging ? " dragging" : "") + (connected ? " connected" : "")}
      style={style}
      {...(!connected ? bind : {})}
    >
      <span className="clue-pin">📌</span>
      <p>{text}</p>
      {connected && <span className="connected-stamp">Pinned</span>}
    </div>
  );
}

function InvestigateScreen({ caseData, connected, onCheck, onContinue }){
  const boardRef = useRef(null);
  const targetRef = useRef(null);
  const connectedCount = connected.filter(Boolean).length;
  const allConnected = connectedCount === 3;

  const handleCheck = useCallback((index, cardRef) => {
    if(!boardRef.current || !targetRef.current || !cardRef.current) return false;
    const boardRect = boardRef.current.getBoundingClientRect();
    const cardRect = cardRef.current.getBoundingClientRect();
    const targetRect = targetRef.current.getBoundingClientRect();
    const cx = cardRect.left + cardRect.width/2;
    const cy = cardRect.top + cardRect.height/2;
    const tx = targetRect.left + targetRect.width/2;
    const ty = targetRect.top + targetRect.height/2;
    const dist = Math.hypot(cx - tx, cy - ty);
    const threshold = Math.max(140, boardRect.width * 0.22);
    if(dist <= threshold){
      onCheck(index);
      return true;
    }
    return false;
  }, [onCheck]);

  return (
    <React.Fragment>
      <div className="section-heading">
        <h2>The Evidence Wall</h2>
        <div className="sub">Drag every clue onto the case file to lock it in as evidence</div>
      </div>

      <div className="corkboard">
        <div className="investigate-board" ref={boardRef}>
          <div className={"target-dock" + (allConnected ? " complete" : "")} ref={targetRef}>
            <span className="dock-icon">{allConnected ? "🗂️" : "📁"}</span>
            {allConnected ? "All Evidence Pinned" : "Drag Clues Here"}
          </div>
          {caseData.clues.map((text, i) => (
            <ClueCard key={caseData.id + "-" + i} index={i} text={text} connected={connected[i]} onCheck={handleCheck} />
          ))}
        </div>
      </div>

      <div className="investigate-footer">
        <div className="clue-progress">Clues connected: <b>{connectedCount}/3</b></div>
        <button className="btn" disabled={!allConnected} onClick={onContinue}>
          {allConnected ? "You're Ready — Solve the Case →" : "Connect All Clues to Continue"}
        </button>
      </div>
    </React.Fragment>
  );
}

/* =========================================================================
   STAGE 4 — SOLVE THE CASE
   ========================================================================= */
function SolveScreen({ caseData, options, selected, onSelect, onSubmit }){
  const letters = ["A","B","C","D"];
  return (
    <React.Fragment>
      <div className="solve-intro">
        <h2>Name the Mistake</h2>
        <p>You've reviewed every file and pinned every clue. Based on the evidence, which of these is the single primary marketing mistake behind {caseData.company}'s underperformance?</p>
      </div>

      <div className="options-grid">
        {options.map((opt, i) => (
          <div
            key={i}
            className={"option-note" + (selected===opt ? " selected" : "")}
            style={{ "--r": (i % 2 === 0 ? -2 : 2) + "deg" }}
            onClick={() => onSelect(opt)}
            role="button"
            tabIndex="0"
            onKeyDown={(e) => { if(e.key==="Enter") onSelect(opt); }}
          >
            <div className="opt-letter">{letters[i]}</div>
            <div>{opt}</div>
          </div>
        ))}
      </div>

      <div className="solve-footer">
        <button className="btn" disabled={!selected} onClick={onSubmit}>File Your Accusation</button>
      </div>
    </React.Fragment>
  );
}

/* =========================================================================
   STAGE 5 — CASE CLOSED
   ========================================================================= */
function ClosedScreen({ correct, caseData, onContinue }){
  return (
    <div className="closed-scene">
      <div className={"stamp " + (correct ? "correct" : "wrong")}>
        {correct ? "Case Closed" : "Case Reopened"}
      </div>
      <p className="closed-sub">
        {correct
          ? <React.Fragment>Sharp work, detective. You correctly identified <b>{caseData.mistake}</b> as the root cause behind {caseData.company}'s underperformance.</React.Fragment>
          : <React.Fragment>Not quite. The real culprit was <b>{caseData.mistake}</b>. Every good detective misreads a clue now and then — the full breakdown is in your report.</React.Fragment>
        }
      </p>
      <button className="btn" onClick={onContinue}>Read the Learning Report →</button>
    </div>
  );
}

/* =========================================================================
   STAGE 6 — LEARNING REPORT
   ========================================================================= */
function ReportScreen({ caseData, correct, solved, attempted, onNewCase }){
  const info = rankInfo(solved);
  return (
    <React.Fragment>
      <div className="report-header">
        <div className="eyebrow">Case #{String(caseData.id).padStart(3,"0")} — Closed {correct ? "Correctly" : "With Assistance"}</div>
        <h2>{caseData.company}: {caseData.mistake}</h2>
        <div className="rank-line">{info.icon} You are now ranked <b>{info.title}</b> — {solved} of {attempted} cases solved correctly.</div>
      </div>

      <div className="report-section">
        <h3>🧩 What Actually Happened</h3>
        <p>{caseData.explanation}</p>
      </div>

      <div className="report-grid">
        <div className="report-section">
          <h3>📌 The Confirmed Clues</h3>
          <ul className="clue-recap">
            {caseData.clues.map((c,i) => (
              <li key={i}><span className="tick" style={{animationDelay:(i*0.12)+"s"}}>✓</span><span>{c}</span></li>
            ))}
          </ul>
        </div>
        <div className="report-section">
          <h3>💰 Budget Breakdown</h3>
          <BudgetChart allocation={caseData.budget.allocation} />
        </div>
      </div>

      <div className="report-section">
        <h3>🛠️ Suggested Improvements</h3>
        <ul className="improve-list">
          {caseData.improvements.map((imp,i) => (
            <li key={i} style={{ animationDelay: (i*0.1)+"s" }}>
              <span className="num">{i+1}</span>
              <span>{imp}</span>
            </li>
          ))}
        </ul>
      </div>

      <div className="report-footer">
        <button className="btn" onClick={onNewCase}>Open the Next Case File</button>
      </div>
    </React.Fragment>
  );
}

/* =========================================================================
   APP ROOT
   ========================================================================= */
function App(){
  const [stage, setStage] = useState("title");
  const [caseData, setCaseData] = useState(null);
  const [lastId, setLastId] = useState(null);
  const [opened, setOpened] = useState({});
  const [connected, setConnected] = useState([false,false,false]);
  const [options, setOptions] = useState([]);
  const [selected, setSelected] = useState(null);
  const [verdictCorrect, setVerdictCorrect] = useState(null);
  const [solved, setSolved] = useState(0);
  const [attempted, setAttempted] = useState(0);

  function pickCase(){
    let pool = CASES;
    if(CASES.length > 1 && lastId !== null){
      pool = CASES.filter(c => c.id !== lastId);
    }
    const next = pool[Math.floor(Math.random() * pool.length)];
    setCaseData(next);
    setLastId(next.id);
    setOpened({});
    setConnected([false,false,false]);
    setOptions([]);
    setSelected(null);
    setVerdictCorrect(null);
  }

  function startNewCase(){
    pickCase();
    setStage("assign");
  }

  function handleOpenFile(key){
    setOpened(prev => ({ ...prev, [key]: true }));
  }

  function handleCheckClue(index){
    setConnected(prev => {
      const next = prev.slice();
      next[index] = true;
      return next;
    });
  }

  function goSolve(){
    const shuffled = shuffle([caseData.mistakeFull, ...caseData.distractors]);
    setOptions(shuffled);
    setSelected(null);
    setStage("solve");
  }

  function submitAccusation(){
    const isCorrect = selected === caseData.mistakeFull;
    setVerdictCorrect(isCorrect);
    setAttempted(a => a + 1);
    if(isCorrect) setSolved(s => s + 1);
    setStage("closed");
  }

  useEffect(() => {
    document.title = caseData ? `Case #${String(caseData.id).padStart(3,"0")} — ${caseData.company}` : "Marketing Detective — Case Files";
  }, [caseData]);

  return (
    <div className="app-shell">
      {stage !== "title" && <TopBar stage={stage} solved={solved} attempted={attempted} />}
      <div className="stage-wrap">
        {stage === "title" && <TitleScreen onStart={startNewCase} solved={solved} attempted={attempted} />}
        {stage === "assign" && caseData && <AssignmentScreen caseData={caseData} onContinue={() => setStage("board")} />}
        {stage === "board" && caseData && <BoardScreen caseData={caseData} opened={opened} onOpen={handleOpenFile} onContinue={() => setStage("investigate")} />}
        {stage === "investigate" && caseData && <InvestigateScreen caseData={caseData} connected={connected} onCheck={handleCheckClue} onContinue={goSolve} />}
        {stage === "solve" && caseData && <SolveScreen caseData={caseData} options={options} selected={selected} onSelect={setSelected} onSubmit={submitAccusation} />}
        {stage === "closed" && caseData && <ClosedScreen correct={verdictCorrect} caseData={caseData} onContinue={() => setStage("report")} />}
        {stage === "report" && caseData && <ReportScreen caseData={caseData} correct={verdictCorrect} solved={solved} attempted={attempted} onNewCase={startNewCase} />}
      </div>
      <footer className="credits">MARKETING DETECTIVE AGENCY · {CASES.length} cases in the archive · all companies and cases are fictional</footer>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>
</body>
